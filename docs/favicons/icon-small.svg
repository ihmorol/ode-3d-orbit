  <path d="M 14 40 A 20 11.5 -22 0 1 46 26" fill="none" stroke="url(#trail)" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="48" cy="24" r="7.5" fill="#4cc3ff"/>
  <circle cx="48" cy="24" r="5" fill="#e8eefc"/>
